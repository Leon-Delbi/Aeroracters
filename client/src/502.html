<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e4d7e8">
  <link rel="icon" type="image/png" href="./favicons/favicon.png">
  <title>502 Bad Gateway | BonziWORLD</title>
  <link rel="stylesheet" href="./error.css">
</head>
<body>
  <main class="error-shell">
    <section class="error-card" aria-labelledby="error-title">
      <header class="window-bar"><span class="window-lights" aria-hidden="true"><i></i><i></i><i></i></span><span>BW // SYSTEM MESSAGE</span></header>
      <div class="error-main">
        <div class="bonzi-mark" aria-hidden="true"><span class="bonzi-eye left"></span><span class="bonzi-eye right"></span><span class="bonzi-mouth"></span></div>
        <div class="error-copy">
          <p class="error-kicker">The gateway lost the gorilla</p>
          <p class="error-code">502</p>
          <h1 class="error-title" id="error-title">BonziWORLD cannot reach the chat server.</h1>
          <p class="error-message">The reverse proxy is still here, but the server behind it is restarting or unavailable. This usually clears up quickly.</p>
          <nav class="error-actions" aria-label="Error actions"><a class="error-link primary" href="/">Return home</a><button class="error-button" onclick="location.reload()">Try again</button></nav>
        </div>
      </div>
      <footer class="error-footer">BonziWORLD // gateway status: no response</footer>
    </section>
  </main>
</body>
</html>
