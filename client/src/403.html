<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e4d7e8">
  <link rel="icon" type="image/png" href="./favicons/favicon.png">
  <title>403 Access Denied | BonziWORLD</title>
  <link rel="stylesheet" href="./error.css">
</head>
<body>
  <main class="error-shell">
    <section class="error-card" aria-labelledby="error-title">
      <header class="window-bar"><span class="window-lights" aria-hidden="true"><i></i><i></i><i></i></span><span>BW // SYSTEM MESSAGE</span></header>
      <div class="error-main">
        <div class="bonzi-mark" aria-hidden="true"><span class="bonzi-eye left"></span><span class="bonzi-eye right"></span><span class="bonzi-mouth"></span></div>
        <div class="error-copy">
          <p class="error-kicker">Permission check failed</p>
          <p class="error-code">403</p>
          <h1 class="error-title" id="error-title">Bonzi says you cannot go in there.</h1>
          <p class="error-message">This area is not available to your browser or account. If you think that is a mistake, reload and try the address again.</p>
          <nav class="error-actions" aria-label="Error actions"><a class="error-link primary" href="/">Return home</a><button class="error-button" onclick="location.reload()">Reload</button></nav>
        </div>
      </div>
      <footer class="error-footer">BonziWORLD // access status: denied</footer>
    </section>
  </main>
</body>
</html>
